name: CI

on:
  push:
    branches:
      - "**"

  pull_request:
    types:
      - ready_for_review
      - synchronize

  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and Export
    runs-on: ubuntu-latest
    timeout-minutes: 30

    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read Godot version
        id: godot-version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f .godot-version ]]; then
            echo "::error::Missing .godot-version"
            exit 1
          fi

          VERSION="$(tr -d '[:space:]' < .godot-version)"

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+-(dev[0-9]+|alpha[0-9]+|beta[0-9]+|rc[0-9]+|stable)$ ]]; then
            echo "::error::Invalid Godot version: $VERSION"
            exit 1
          fi

          echo "release_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "expected_version=${VERSION/-/.}" >> "$GITHUB_OUTPUT"

      - name: Download Godot
        shell: bash
        env:
          VERSION: ${{ steps.godot-version.outputs.release_version }}
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_linux.x86_64.zip"

          curl --fail --location --silent --show-error \
            "$URL" --output "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"

          GODOT_BIN="$RUNNER_TEMP/godot/Godot_v${VERSION}_linux.x86_64"

          if [[ ! -f "$GODOT_BIN" ]]; then
            echo "::error::Godot executable not found"
            find "$RUNNER_TEMP/godot" -maxdepth 2 -type f
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Verify Godot version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.godot-version.outputs.expected_version }}
        run: |
          set -euo pipefail

          ACTUAL_VERSION="$("$GODOT_BIN" --version)"

          echo "Expected: $EXPECTED_VERSION"
          echo "Actual:   $ACTUAL_VERSION"

          if [[ "$ACTUAL_VERSION" != "$EXPECTED_VERSION"* ]]; then
            echo "::error::Godot version does not match .godot-version"
            exit 1
          fi

      - name: Download export templates
        shell: bash
        env:
          VERSION: ${{ steps.godot-version.outputs.release_version }}
          GODOT_VERSION: ${{ steps.godot-version.outputs.expected_version }}
        run: |
          set -euo pipefail

          URL="https://github.com/godotengine/godot-builds/releases/download/${VERSION}/Godot_v${VERSION}_export_templates.tpz"

          curl --fail --location --silent --show-error \
            "$URL" --output "$RUNNER_TEMP/export_templates.tpz"

          mkdir -p "$RUNNER_TEMP/templates"
          unzip -q "$RUNNER_TEMP/export_templates.tpz" \
            -d "$RUNNER_TEMP/templates"

          SOURCE_DIR="$RUNNER_TEMP/templates/templates"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/$GODOT_VERSION"

          if [[ ! -d "$SOURCE_DIR" ]]; then
            echo "::error::Export template directory not found"
            find "$RUNNER_TEMP/templates" -maxdepth 3 -type f
            exit 1
          fi

          mkdir -p "$TEMPLATE_DIR"
          cp -a "$SOURCE_DIR/." "$TEMPLATE_DIR/"

          test -f "$TEMPLATE_DIR/linux_release.x86_64"
          test -f "$TEMPLATE_DIR/windows_release_x86_64.exe"

      - name: Import project resources
        shell: bash
        run: |
          set -euo pipefail

          "$GODOT_BIN" \
            --headless \
            --editor \
            --path . \
            --quit

      - name: Validate GDScript files
        shell: bash
        run: |
          set -euo pipefail

          cat > "$RUNNER_TEMP/validate_scripts.gd" <<'GDSCRIPT'
          extends SceneTree

          var errors: Array[String] = []
          var checked := 0

          func _initialize() -> void:
              scan_directory("res://")
              print("GDScript files checked: ", checked)

              if not errors.is_empty():
                  for error in errors:
                      push_error(error)
                  quit(1)
                  return

              print("GDScript validation passed.")
              quit(0)

          func scan_directory(path: String) -> void:
              var directory := DirAccess.open(path)

              if directory == null:
                  errors.append("Cannot open directory: " + path)
                  return

              for filename in directory.get_files():
                  if filename.ends_with(".gd"):
                      check_script(path.path_join(filename))

              for dirname in directory.get_directories():
                  if dirname in [".git", ".godot", "build"]:
                      continue

                  scan_directory(path.path_join(dirname))

          func check_script(script_path: String) -> void:
              checked += 1

              var script = ResourceLoader.load(
                  script_path,
                  "GDScript",
                  ResourceLoader.CACHE_MODE_REPLACE
              )

              if script == null:
                  errors.append("Failed to load or parse: " + script_path)
          GDSCRIPT

          "$GODOT_BIN" \
            --headless \
            --path . \
            --script "$RUNNER_TEMP/validate_scripts.gd"

      - name: Export Linux build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/linux

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-release "Linux" \
            build/linux/Spider-FUN.x86_64

          test -f build/linux/Spider-FUN.x86_64
          test -f build/linux/Spider-FUN.pck

      - name: Export Windows build
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build/windows

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-release "Windows" \
            build/windows/Spider-FUN.exe

          test -f build/windows/Spider-FUN.exe
          test -f build/windows/Spider-FUN.pck

      - name: Clean up temporary builds
        if: always()
        shell: bash
        run: |
          rm -rf build/linux build/windows
